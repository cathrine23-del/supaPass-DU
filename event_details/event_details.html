<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Details | SupaPass DU</title>

    <link rel="stylesheet" href="/SupaPass-DU/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="container nav-inner">

        <a href="/SupaPass-DU/index.html" class="brand">

            <span class="brand-mark">
                <i class="fa-solid fa-ticket"></i>
            </span>

            <span class="brand-text">

                <strong>
                    SupaPass <span>DU</span>
                </strong>

                <small>
                    Your campus. Your events. Your pass.
                </small>

            </span>

        </a>


        <div class="nav-right-controls">

            <span id="userAccount" class="user-account"></span>


            <button
                type="button"
                class="menu-toggle-btn"
                id="menuToggleBtn"
                aria-label="Open navigation menu"
                aria-expanded="false">

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </div>

</header>



<!-- =========================================================
     NAVIGATION DRAWER
========================================================= -->

<div id="navDrawerBackdrop" class="drawer-backdrop"></div>


<aside id="navDrawer" class="nav-drawer" aria-hidden="true">

    <div class="drawer-header">

        <div class="brand">

            <span class="brand-mark">
                <i class="fa-solid fa-ticket"></i>
            </span>

            <span class="brand-text">

                <strong>
                    SupaPass <span>DU</span>
                </strong>

                <small>
                    Campus Menu
                </small>

            </span>

        </div>


        <button
            type="button"
            class="drawer-close-btn"
            id="drawerCloseBtn"
            aria-label="Close navigation menu">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>



    <nav class="drawer-links">

        <a href="/SupaPass-DU/index.html">

            <i class="fa-solid fa-house"></i>
            Home

        </a>


        <a href="/SupaPass-DU/events/events.html" class="active">

            <i class="fa-solid fa-calendar-days"></i>
            Events

        </a>


        <a href="/SupaPass-DU/categories/categories.html">

            <i class="fa-solid fa-layer-group"></i>
            Categories

        </a>


        <a href="/SupaPass-DU/about/about.html">

            <i class="fa-solid fa-circle-info"></i>
            About

        </a>


        <a href="/SupaPass-DU/student/tickets.html">

            <i class="fa-solid fa-ticket"></i>
            My Tickets

        </a>

    </nav>



    <div class="drawer-footer">

        <button
            type="button"
            class="btn btn-outline full-width"
            id="loginBtn">

            <i class="fa-solid fa-user"></i>
            Sign In

        </button>


        <button
            type="button"
            class="btn btn-primary full-width"
            id="organizerBtn">

            <i class="fa-solid fa-plus"></i>
            Become an Organizer

        </button>


        <button
            id="logoutBtn"
            class="btn btn-outline full-width logout-drawer-btn"
            style="display: none;">

            <i class="fa-solid fa-right-from-bracket"></i>
            Logout

        </button>

    </div>

</aside>



<!-- =========================================================
     EVENT DETAILS
========================================================= -->

<main>

    <section class="section dashboard-section">

        <div class="container">


            <!-- TOP BAR -->

            <div class="dashboard-topbar">

                <a href="/SupaPass-DU/events/events.html" class="btn btn-outline">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Events

                </a>


                <span class="dashboard-badge">

                    <i class="fa-solid fa-ticket"></i>

                    Event Page

                </span>

            </div>



            <!-- EVENT DETAILS WILL BE LOADED BY APP.JS -->

            <div
                id="eventDetailsContent"
                class="dashboard-card">

                <div class="dashboard-body">

                    <p style="color: var(--muted);">

                        Loading event details...

                    </p>

                </div>

            </div>


        </div>

    </section>

</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="footer compact-footer">

    <div class="container copyright">

        <span>
            © 2026 SupaPass DU
        </span>

        <span>
            Daystar University Campus Event Hub
        </span>

    </div>

</footer>



<!-- MODAL ROOT -->

<div id="modalRoot"></div>


<!-- MAIN JAVASCRIPT -->

<script src="/SupaPass-DU/app.js"></script>


</body>

</html>
